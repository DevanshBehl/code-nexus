# Code Nexus — local RTMP -> HLS media server (Phase 8 webinars, dev only).
# Mounted into the `media` docker-compose service (profile: media). Enables HLS
# with NESTED output so a stream pushed to rtmp://host:1935/live/<streamKey>
# is served at http://host:80/live/<streamKey>/index.m3u8 — the exact path the
# api's `selfhosted` media provider computes.

worker_processes auto;
events {
  worker_connections 1024;
}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;
      record off;

      # Emit HLS. `hls_nested on` puts each stream in its own directory with an
      # index.m3u8, matching <HLS_PLAYBACK_BASE>/live/<streamKey>/index.m3u8.
      hls on;
      hls_path /tmp/hls;
      hls_nested on;
      hls_fragment 2s;
      hls_playlist_length 12s;
    }
  }
}

http {
  server {
    listen 80;

    # Serve the generated HLS playlists + segments with permissive CORS so the
    # web app (a different origin, e.g. :5173) can fetch them via hls.js.
    location /live {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      alias /tmp/hls;
      add_header Cache-Control no-cache always;
      add_header Access-Control-Allow-Origin * always;
    }
  }
}
