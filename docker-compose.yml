# =============================================================================
# Code Nexus — local development infrastructure
# All credentials here are LOCAL DEV ONLY. Do not reuse in staging/production.
# Bring up with:  pnpm infra:up   (docker compose up --wait)
#
# Code execution (Phase 6 — Code Arena): the execution-worker talks to Judge0
# over JUDGE0_URL. Judge0 is NOT run here by default because its `isolate`
# sandbox needs Linux cgroup features that Docker Desktop on macOS does not
# expose. Choose one:
#   1) RapidAPI (recommended, works from macOS): set JUDGE0_URL + JUDGE0_API_KEY
#      + JUDGE0_API_HOST in .env (see .env.example).
#   2) Self-host on Linux (VM / Colima / cloud): run Judge0's own compose and
#      point JUDGE0_URL at it (default http://localhost:2358).
# Without JUDGE0_URL the platform still runs; submissions are marked ERROR.
# =============================================================================

services:
  postgres:
    image: postgres:16
    container_name: codenexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codenexus
      POSTGRES_PASSWORD: codenexus_dev_pw
      POSTGRES_DB: codenexus
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codenexus -d codenexus']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: codenexus-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: codenexus-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: codenexus
      RABBITMQ_DEFAULT_PASS: codenexus_dev_pw
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: codenexus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codenexus
      MINIO_ROOT_PASSWORD: codenexus_dev_pw
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the default bucket, then exits. Runs only with the
  # `init` profile so it is excluded from `docker compose up --wait`.
  minio-setup:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: codenexus-minio-setup
    profiles: ['init']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 codenexus codenexus_dev_pw &&
      mc mb --ignore-existing local/code-nexus-dev &&
      echo 'Bucket code-nexus-dev ready.'
      "

  # RTMP -> HLS media server for MEDIA_PROVIDER=selfhosted (Phase 8 webinars).
  # Runs only with the `media` profile (excluded from the default `up --wait`),
  # since webinars work end-to-end with MEDIA_PROVIDER=stub and no media server.
  # The host pushes RTMP to rtmp://localhost:1935/live/<streamKey> (e.g. from OBS);
  # viewers play http://localhost:8888/live/<streamKey>/index.m3u8 via hls.js.
  media:
    image: tiangolo/nginx-rtmp
    container_name: codenexus-media
    profiles: ['media']
    ports:
      - '1935:1935' # RTMP ingest (host encoder pushes here)
      - '8888:80' # HLS playback (viewers pull here)
    volumes:
      # HLS-enabled nginx config (nested output at /live/<streamKey>/index.m3u8).
      - ./docker/media/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
